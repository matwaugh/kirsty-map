<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kirsty Map</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial,sans-serif;
}

#map{
width:100%;
height:100vh;
}

.popup{
max-width:260px;
}

.popup img{
width:100%;
border-radius:8px;
margin-bottom:8px;
}

.popup h3{
margin:0 0 6px 0;
font-size:18px;
}

.popup p{
margin:0 0 6px 0;
font-size:14px;
}

.legend{
background:white;
padding:10px 12px;
border-radius:8px;
box-shadow:0 1px 5px rgba(0,0,0,0.2);
font-size:14px;
}

.legend div{
display:flex;
align-items:center;
gap:8px;
margin:4px 0;
}

</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const sheetUrl =
"https://opensheet.elk.sh/1MCXldIJGYyWbbVmfqq8etjsrsGlygOtWgxMu-gGhl_E/Map%20Export";

const map = L.map('map').setView([54.5,-3],5);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{ attribution:'© OpenStreetMap contributors'}
).addTo(map);



/* ICONS */

const kirstyIcon = L.icon({
iconUrl:'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2b50.png',
iconSize:[28,28],
iconAnchor:[14,28],
popupAnchor:[0,-28]
});

const supporterIcon = L.icon({
iconUrl:'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f499.png',
iconSize:[28,28],
iconAnchor:[14,28],
popupAnchor:[0,-28]
});



const kirstiesLayer = L.layerGroup().addTo(map);
const supportersLayer = L.layerGroup().addTo(map);

L.control.layers(
null,
{
"Kirsties":kirstiesLayer,
"Supporters":supportersLayer
},
{collapsed:false}
).addTo(map);



function escapeHtml(str){
return String(str||'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');
}



function buildPopup(row){

const name=escapeHtml(row.Name||'');
const location=escapeHtml(row.Location||'');
const description=escapeHtml(row.Description||'');
const image=row.Image||'';

return `
<div class="popup">
${image?`<img src="${image}">`:''}
<h3>${name}</h3>
${location?`<p><b>${location}</b></p>`:''}
${description?`<p>${description.replace(/\n/g,'<br>')}</p>`:''}
</div>
`;

}



async function loadMapData(){

const response = await fetch(sheetUrl);
const rows = await response.json();

const bounds=[];

for(const row of rows){

const lat=parseFloat(row.Lat);
const lng=parseFloat(row.Lng);

if(isNaN(lat)||isNaN(lng)) continue;

const layer=(row.Layer||'').trim().toLowerCase();

let marker;

if(layer==="kirsties"){
marker=L.marker([lat,lng],{icon:kirstyIcon});
marker.addTo(kirstiesLayer);
}
else{
marker=L.marker([lat,lng],{icon:supporterIcon});
marker.addTo(supportersLayer);
}

marker.bindPopup(buildPopup(row));

bounds.push([lat,lng]);

}

if(bounds.length){
map.fitBounds(bounds,{padding:[30,30]});
}

}

loadMapData();

</script>

</body>
</html>
