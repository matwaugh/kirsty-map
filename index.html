<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kirsty Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial,sans-serif;
}

#map{
width:100%;
height:100vh;
}

.popup{
max-width:260px;
}

.popup img{
width:100%;
border-radius:8px;
margin-bottom:8px;
}

.popup h3{
margin:0 0 6px 0;
font-size:18px;
}

.popup p{
margin:0 0 6px 0;
font-size:14px;
}

/* legend */

.legend{
background:white;
padding:10px 12px;
border-radius:8px;
box-shadow:0 1px 5px rgba(0,0,0,0.2);
font-size:14px;
line-height:1.5;
}

.legend-row{
display:flex;
align-items:center;
gap:8px;
margin:4px 0;
}

.legend svg{
width:22px;
height:22px;
}

</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const sheetUrl =
"https://opensheet.elk.sh/1MCXldIJGYyWbbVmfqq8etjsrsGlygOtWgxMu-gGhl_E/Map%20Export";

const map = L.map('map').setView([54.5,-3],5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);



/* ICON SVGs */

const starSvg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<path d="M36 8l7.2 14.6 16.1 2.3-11.7 11.4 2.8 16L36 44.9 21.6 52.3l2.8-16L12.7 24.9l16.1-2.3L36 8z"
fill="#EB068C" stroke="#ffffff" stroke-width="3"/>
</svg>`;

const heartSvg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<path d="M36 58s-19-11.8-25.4-22.2C4.5 26.2 10 14 21 14c6 0 10.5 3 15 8.5C40.5 17 45 14 51 14c11 0 16.5 12.2 10.4 21.8C55 46.2 36 58 36 58z"
fill="#ADEBB3" stroke="#ffffff" stroke-width="3"/>
</svg>`;

function svgToUrl(svg){
return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}



const kirstyIcon = L.icon({
iconUrl: svgToUrl(starSvg),
iconSize:[32,32],
iconAnchor:[16,30],
popupAnchor:[0,-28]
});

const supporterIcon = L.icon({
iconUrl: svgToUrl(heartSvg),
iconSize:[32,32],
iconAnchor:[16,30],
popupAnchor:[0,-28]
});



const kirstiesLayer = L.layerGroup().addTo(map);
const supportersLayer = L.layerGroup().addTo(map);

L.control.layers(
null,
{
"Kirsties":kirstiesLayer,
"Supporters":supportersLayer
},
{collapsed:false}
).addTo(map);



/* legend */

const legend = L.control({position:'bottomright'});

legend.onAdd = function(){

const div = L.DomUtil.create('div','legend');

div.innerHTML = `
<div class="legend-row">${starSvg} Kirsties</div>
<div class="legend-row">${heartSvg} Supporters</div>
`;

return div;

};

legend.addTo(map);



function escapeHtml(str){
return String(str||'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#39;');
}



function buildPopup(row) {
  const name = escapeHtml(row.Name || '');
  const location = escapeHtml(row.Location || '');
  const description = escapeHtml(row.Description || '');
  let image = row.Image || '';

  if (image && image.includes('res.cloudinary.com')) {
    image = image.replace('/image/upload/', '/image/upload/w_600,f_auto,q_auto/');
  }

  return `
    <div class="popup">
      ${image ? `<img src="${image}" alt="${name}" loading="lazy">` : ''}
      <h3>${name}</h3>
      ${location ? `<p><strong>${location}</strong></p>` : ''}
      ${description ? `<p>${description.replace(/\n/g, '<br>')}</p>` : ''}
    </div>
  `;
}



async function loadMapData(){

const response = await fetch(sheetUrl);
const rows = await response.json();

const bounds=[];

for(const row of rows){

const lat=parseFloat(row.Lat);
const lng=parseFloat(row.Lng);

if(isNaN(lat)||isNaN(lng)) continue;

const layer=(row.Layer||'').trim().toLowerCase();

let marker;

if(layer==="kirsties"){
marker=L.marker([lat,lng],{icon:kirstyIcon});
marker.addTo(kirstiesLayer);
}
else{
marker=L.marker([lat,lng],{icon:supporterIcon});
marker.addTo(supportersLayer);
}

marker.bindPopup(buildPopup(row));

bounds.push([lat,lng]);

}

if(bounds.length){
map.fitBounds(bounds,{padding:[30,30]});
}

}

loadMapData();

</script>

</body>
</html>
