<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kirsty Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100vh;
}

.popup{
  max-width:260px;
}

.popup img{
  width:100%;
  border-radius:8px;
  margin-bottom:8px;
}

.popup h3{
  margin:0 0 6px 0;
  font-size:18px;
}

.popup p{
  margin:0 0 6px 0;
  font-size:14px;
}

/* search */

.search-box{
  background:white;
  padding:10px;
  border-radius:8px;
  box-shadow:0 1px 5px rgba(0,0,0,0.2);
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:240px;
}

.search-row{
  display:flex;
  gap:8px;
  align-items:center;
}

.search-box input{
  flex:1;
  min-width:0;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

.search-box button{
  padding:8px 10px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.search-box button:hover{
  background:#f5f5f5;
}

.search-status{
  font-size:12px;
  color:#666;
  min-height:16px;
}

/* layer labels with icons */

.layer-label{
  display:flex;
  align-items:center;
  gap:8px;
}

.layer-label svg{
  width:18px;
  height:18px;
  flex:0 0 auto;
}

/* slightly tidy the default Leaflet control stack */

.leaflet-top.leaflet-right .leaflet-control{
  margin-top:10px;
  margin-right:10px;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
const sheetUrl =
  "https://opensheet.elk.sh/1MCXldIJGYyWbbVmfqq8etjsrsGlygOtWgxMu-gGhl_E/Map%20Export";

const map = L.map('map').setView([54.5,-3],5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

/* ICON SVGs */

const starSvg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<path d="M36 8l7.2 14.6 16.1 2.3-11.7 11.4 2.8 16L36 44.9 21.6 52.3l2.8-16L12.7 24.9l16.1-2.3L36 8z"
fill="#EB068C" stroke="#ffffff" stroke-width="3"/>
</svg>`;

const heartSvg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<path d="M36 58s-19-11.8-25.4-22.2C4.5 26.2 10 14 21 14c6 0 10.5 3 15 8.5C40.5 17 45 14 51 14c11 0 16.5 12.2 10.4 21.8C55 46.2 36 58 36 58z"
fill="#ADEBB3" stroke="#ffffff" stroke-width="3"/>
</svg>`;

function svgToUrl(svg){
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

const kirstyIcon = L.icon({
  iconUrl: svgToUrl(starSvg),
  iconSize:[32,32],
  iconAnchor:[16,30],
  popupAnchor:[0,-28]
});

const supporterIcon = L.icon({
  iconUrl: svgToUrl(heartSvg),
  iconSize:[32,32],
  iconAnchor:[16,30],
  popupAnchor:[0,-28]
});

/* CLUSTERED OVERLAYS */

const kirstiesLayer = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  maxClusterRadius: 40
});

const supportersLayer = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  maxClusterRadius: 40
});

kirstiesLayer.addTo(map);
supportersLayer.addTo(map);

L.control.layers(
  null,
  {
    [`<span class="layer-label">${starSvg}<span>Kirsties</span></span>`]: kirstiesLayer,
    [`<span class="layer-label">${heartSvg}<span>Supporters</span></span>`]: supportersLayer
  },
  {collapsed:false, position:'topright'}
).addTo(map);

function escapeHtml(str){
  return String(str||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function buildPopup(row) {
  const name = escapeHtml(row.Name || '');
  const location = escapeHtml(row.Location || '');
  const description = escapeHtml(row.Description || '');
  let image = row["Cloudinary URL"] || row.Image || '';

  if (image && image.includes('res.cloudinary.com')) {
    image = image.replace('/image/upload/', '/image/upload/w_600,f_auto,q_auto/');
  }

  return `
    <div class="popup">
      ${image ? `<img src="${image}" alt="${name}" loading="lazy">` : ''}
      <h3>${name}</h3>
      ${location ? `<p><strong>${location}</strong></p>` : ''}
      ${description ? `<p>${description.replace(/\n/g, '<br>')}</p>` : ''}
    </div>
  `;
}

function getOffsetCoords(lat, lng, index, total) {
  if (total <= 1) return [lat, lng];

  const angle = (2 * Math.PI * index) / total;
  const radius = 0.003;

  const latOffset = Math.sin(angle) * radius;
  const lngOffset = Math.cos(angle) * radius / Math.max(Math.cos(lat * Math.PI / 180), 0.2);

  return [lat + latOffset, lng + lngOffset];
}

/* SEARCH CONTROL */

let searchableMarkers = [];

const SearchControl = L.Control.extend({
  options: {
    position: 'topright'
  },

  onAdd: function() {
    const container = L.DomUtil.create('div', 'search-box');

    container.innerHTML = `
      <div class="search-row">
        <input id="map-search-input" type="text" placeholder="Search name or location">
        <button id="map-search-button" type="button">Search</button>
      </div>
      <div id="map-search-status" class="search-status"></div>
    `;

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);

    return container;
  }
});

map.addControl(new SearchControl());

function runSearch() {
  const input = document.getElementById('map-search-input');
  const status = document.getElementById('map-search-status');

  if (!input || !status) return;

  const query = String(input.value || '').trim().toLowerCase();

  if (!query) {
    status.textContent = 'Enter a name or location.';
    return;
  }

  const match = searchableMarkers.find(item => {
    const name = String(item.row.Name || '').toLowerCase();
    const location = String(item.row.Location || '').toLowerCase();
    return name.includes(query) || location.includes(query);
  });

  if (!match) {
    status.textContent = 'No match found.';
    return;
  }

  status.textContent = `Found: ${match.row.Name || match.row.Location || 'match'}`;

  match.group.zoomToShowLayer(match.marker, function() {
    map.setView(match.marker.getLatLng(), Math.max(map.getZoom(), 8));
    match.marker.openPopup();
  });
}

document.addEventListener('click', function(e) {
  if (e.target && e.target.id === 'map-search-button') {
    runSearch();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.target && e.target.id === 'map-search-input' && e.key === 'Enter') {
    e.preventDefault();
    runSearch();
  }
});

async function loadMapData() {
  try {
    const response = await fetch(sheetUrl);
    const rows = await response.json();
    const bounds = [];

    kirstiesLayer.clearLayers();
    supportersLayer.clearLayers();
    searchableMarkers = [];

    const groupedByCoords = {};

    for (const row of rows) {
      const lat = parseFloat(row.Lat);
      const lng = parseFloat(row.Lng);

      if (isNaN(lat) || isNaN(lng)) continue;

      const key = `${lat.toFixed(6)},${lng.toFixed(6)}`;

      if (!groupedByCoords[key]) {
        groupedByCoords[key] = [];
      }

      groupedByCoords[key].push(row);
    }

    for (const key of Object.keys(groupedByCoords)) {
      const group = groupedByCoords[key];
      const baseLat = parseFloat(group[0].Lat);
      const baseLng = parseFloat(group[0].Lng);

      for (let i = 0; i < group.length; i++) {
        const row = group[i];
        const layer = (row.Layer || '').trim().toLowerCase();
        const coords = getOffsetCoords(baseLat, baseLng, i, group.length);

        let marker;
        let markerGroup;

        if (layer === 'kirsties') {
          marker = L.marker(coords, { icon: kirstyIcon });
          kirstiesLayer.addLayer(marker);
          markerGroup = kirstiesLayer;
        } else {
          marker = L.marker(coords, { icon: supporterIcon });
          supportersLayer.addLayer(marker);
          markerGroup = supportersLayer;
        }

        marker.bindPopup(buildPopup(row));
        searchableMarkers.push({
          row: row,
          marker: marker,
          group: markerGroup
        });

        bounds.push(coords);
      }
    }

    if (bounds.length) {
      const latLngBounds = L.latLngBounds(bounds);

      setTimeout(() => {
        map.invalidateSize();
        map.fitBounds(latLngBounds, {
          padding: [30, 30],
          maxZoom: 6
        });
      }, 300);
    }
  } catch (error) {
    console.error('Error loading map data:', error);
  }
}

window.addEventListener('load', () => {
  setTimeout(() => {
    map.invalidateSize();
  }, 400);
});

loadMapData();
</script>

</body>
</html>
