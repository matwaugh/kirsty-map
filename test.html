<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kirsty Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100vh;
}

.fit-all-btn{
  width:42px;
  height:42px;
  border:none;
  background:#fff;
  border-radius:8px;
  box-shadow:0 1px 5px rgba(0,0,0,0.2);
  cursor:pointer;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#333;
  -webkit-appearance:none;
}

.fit-all-btn:hover{
  background:#f6f6f6;
}

.popup{
  width:240px;
  max-width:calc(100vw - 100px);
}

.popup img{
  width:100%;
  height:auto;
  display:block;
  border-radius:8px;
  margin-bottom:8px;
}

.popup h3{
  margin:0 0 6px 0;
  font-size:18px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.popup p{
  margin:0 0 6px 0;
  font-size:14px;
}

.leaflet-popup-content{
  margin:12px 14px;
}

.leaflet-popup-content-wrapper{
  border-radius:12px;
}

.custom-legend{
  background:#fff;
  padding:10px 12px;
  border-radius:8px;
  box-shadow:0 1px 5px rgba(0,0,0,0.2);
  line-height:1.2;
}

.custom-legend .legend-item{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}

.custom-legend .legend-item + .legend-item{
  margin-top:8px;
}

.custom-legend svg{
  width:18px;
  height:18px;
  flex:0 0 auto;
}

.legend-donation-badge,
.donation-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#FF8847;
  color:#ffffff;
  font-size:9px;
  font-weight:700;
  line-height:1;
  vertical-align:middle;
  box-sizing:border-box;
}

.leaflet-top.leaflet-right .leaflet-control{
  margin-top:10px;
  margin-right:10px;
}

/* search */

.search-wrap{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.search-toggle{
  width:42px;
  height:42px;
  border:none;
  background:#fff;
  border-radius:8px;
  box-shadow:0 1px 5px rgba(0,0,0,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
  line-height:1;
  flex:0 0 auto;
}

.search-toggle:hover{
  background:#f6f6f6;
}

.search-panel{
  background:white;
  padding:10px;
  border-radius:8px;
  box-shadow:0 1px 5px rgba(0,0,0,0.2);
  display:none;
  width:320px;
  max-width:min(320px,72vw);
}

.search-panel.open{
  display:block;
}

.search-row{
  display:flex;
  gap:8px;
  align-items:center;
}

.search-panel input{
  flex:1;
  min-width:0;
  padding:8px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

.search-panel button{
  padding:8px 10px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
}

.search-panel button:hover{
  background:#f5f5f5;
}

.search-status{
  margin-top:8px;
  font-size:12px;
  color:#666;
  min-height:16px;
}

.search-nav{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.search-nav button{
  flex:1;
}

@media (max-width: 640px){
  .search-wrap{
    gap:8px;
  }

  .search-panel{
    width:240px;
    max-width:68vw;
  }
}

/* Kirsty marker with halo behind the star */

.kirsty-marker{
  position:relative;
  width:32px;
  height:32px;
  background:transparent !important;
  border:none !important;
}

.kirsty-marker::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:42px;
  height:42px;
  margin-left:-21px;
  margin-top:-21px;
  border-radius:50%;
  background:rgba(235, 6, 140, 0.22);
  animation:haloPulse 2.5s ease-out infinite;
  pointer-events:none;
  z-index:0;
}

.kirsty-marker svg{
  position:relative;
  display:block;
  width:32px;
  height:32px;
  z-index:1;
}

@keyframes haloPulse{
  0%{
    transform:scale(0.6);
    opacity:0.75;
  }

  70%{
    transform:scale(1.8);
    opacity:0;
  }

  100%{
    transform:scale(1.8);
    opacity:0;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
const sheetUrl =
  "https://opensheet.elk.sh/1MCXldIJGYyWbbVmfqq8etjsrsGlygOtWgxMu-gGhl_E/Public%20Map";

const map = L.map('map').setView([54.5,-3],5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

/* ICON SVGs */

const starSvg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<path d="M36 8l7.2 14.6 16.1 2.3-11.7 11.4 2.8 16L36 44.9 21.6 52.3l2.8-16L12.7 24.9l16.1-2.3L36 8z"
fill="#FF8847" stroke="#ffffff" stroke-width="3"/>
</svg>`;

const supporterHeartSvg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<path d="M36 58s-19-11.8-25.4-22.2C4.5 26.2 10 14 21 14c6 0 10.5 3 15 8.5C40.5 17 45 14 51 14c11 0 16.5 12.2 10.4 21.8C55 46.2 36 58 36 58z"
fill="#ADEBB3" stroke="#ffffff" stroke-width="3"/>
</svg>`;

function svgToUrl(svg){
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

const kirstyIcon = L.divIcon({
  className: 'kirsty-marker',
  html: starSvg,
  iconSize: [32, 32],
  iconAnchor: [16, 30],
  popupAnchor: [0, -28]
});

const supporterIcon = L.icon({
  iconUrl: svgToUrl(supporterHeartSvg),
  iconSize:[26,26],
  iconAnchor:[13,24],
  popupAnchor:[0,-22]
});

/* SINGLE SHARED CLUSTER LAYER */

const markersLayer = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  maxClusterRadius: 40
});

markersLayer.addTo(map);

/* SIMPLE LEGEND */

const LegendControl = L.Control.extend({
  options: {
    position: 'topright'
  },

  onAdd: function() {
    const container = L.DomUtil.create('div', 'custom-legend');

    container.innerHTML = `
      <div class="legend-item">
        ${starSvg}
        <span id="legend-kirstys-label">Kirstys</span>
      </div>
      <div class="legend-item">
        ${supporterHeartSvg}
        <span id="legend-supporters-label">Supporters</span>
      </div>
      <div class="legend-item">
        <span>Donated?</span>
        <span class="legend-donation-badge">✓</span>
      </div>
    `;

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);

    return container;
  }
});

map.addControl(new LegendControl());

const FitAllControl = L.Control.extend({
  options: {
    position: 'bottomright'
  },

  onAdd: function() {
    const button = L.DomUtil.create('button', 'fit-all-btn');
    button.innerHTML = 'Show all';
    button.title = 'Show all map entries';

    L.DomEvent.disableClickPropagation(button);
    L.DomEvent.on(button, 'click', function() {
      if (!allRows.length) return;
      map.fitBounds(allDataBounds, {
        padding: [30, 30],
        maxZoom: 6
      });
    });

    return button;
  }
});

map.addControl(new FitAllControl());

function escapeHtml(str){
  return String(str||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function donatedBadgeHtml(donated) {
  return String(donated || '').trim() === 'Yes'
    ? '<span class="donation-badge" aria-label="Donated" title="Donated">✓</span>'
    : '';
}

function buildPopup(row) {
  const name = escapeHtml(row.Name || '');
  const location = escapeHtml(row.Location || '');
  const description = escapeHtml(row.Description || '');
  const donatedBadge = donatedBadgeHtml(row['Donated?']);
  let image = row["Cloudinary URL"] || row.Image || '';

  if (image && image.includes('res.cloudinary.com')) {
    image = image.replace('/image/upload/', '/image/upload/w_auto,dpr_auto,f_auto,q_auto/');
  }

  return `
    <div class="popup">
      ${image ? `<img src="${image}" alt="${name}" loading="lazy">` : ''}
      <h3>${name}${donatedBadge ? ` ${donatedBadge}` : ''}</h3>
      ${location ? `<p><strong>${location}</strong></p>` : ''}
      ${description ? `<p>${description.replace(/\n/g, '<br>')}</p>` : ''}
    </div>
  `;
}

function getOffsetCoords(lat, lng, index, total) {
  if (total <= 1) return [lat, lng];

  const angle = (2 * Math.PI * index) / total;
  const radius = 0.003;

  const latOffset = Math.sin(angle) * radius;
  const lngOffset = Math.cos(angle) * radius / Math.max(Math.cos(lat * Math.PI / 180), 0.2);

  return [lat + latOffset, lng + lngOffset];
}

function updateLegendCounts(rows) {
  let kirstysCount = 0;
  let supportersCount = 0;

  for (const row of rows) {
    const lat = parseFloat(row.Lat);
    const lng = parseFloat(row.Lng);

    if (isNaN(lat) || isNaN(lng)) continue;

    const layer = String(row.Layer || '').trim().toLowerCase();

    if (layer === 'kirsties') {
      kirstysCount++;
    } else {
      supportersCount++;
    }
  }

  const kirstysLabel = document.getElementById('legend-kirstys-label');
  const supportersLabel = document.getElementById('legend-supporters-label');

  if (kirstysLabel) {
    kirstysLabel.textContent = `Kirstys (${kirstysCount})`;
  }

  if (supportersLabel) {
    supportersLabel.textContent = `Supporters (${supportersCount})`;
  }
}

/* SEARCH + DATA STATE */

let searchableMarkers = [];
let currentMatches = [];
let currentMatchIndex = 0;

let allRows = [];
let allDataBounds = null;
let renderTimer = null;

/* SEARCH UI */

const SearchControl = L.Control.extend({
  options: {
    position: 'topright'
  },

  onAdd: function() {
    const container = L.DomUtil.create('div', 'search-wrap');

    container.innerHTML = `
      <div id="map-search-panel" class="search-panel">
        <div class="search-row">
          <input id="map-search-input" type="text" placeholder="Search name or location">
          <button id="map-search-button" type="button">Go</button>
        </div>
        <div id="map-search-status" class="search-status"></div>
        <div class="search-nav">
          <button id="map-search-prev" type="button">Prev</button>
          <button id="map-search-next" type="button">Next</button>
        </div>
      </div>
      <button id="map-search-toggle" class="search-toggle" type="button" aria-label="Open search">🔍</button>
    `;

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);

    return container;
  }
});

map.addControl(new SearchControl());

function getSearchPanel() {
  return document.getElementById('map-search-panel');
}

function getSearchInput() {
  return document.getElementById('map-search-input');
}

function setSearchStatus(text) {
  const status = document.getElementById('map-search-status');
  if (status) status.textContent = text || '';
}

function closeSearchPanel() {
  const panel = getSearchPanel();
  if (panel) panel.classList.remove('open');
}

function openSearchPanel() {
  const panel = getSearchPanel();
  const input = getSearchInput();
  if (!panel) return;

  panel.classList.add('open');

  if (input) {
    setTimeout(() => input.focus(), 50);
  }
}

function toggleSearchPanel() {
  const panel = getSearchPanel();
  if (!panel) return;

  if (panel.classList.contains('open')) {
    closeSearchPanel();
  } else {
    openSearchPanel();
  }
}

function ensurePopup(marker, row) {
  if (!marker.getPopup()) {
    marker.bindPopup(buildPopup(row));
  }
}

function showMatch(index) {
  if (!currentMatches.length) return;

  if (index < 0) index = currentMatches.length - 1;
  if (index >= currentMatches.length) index = 0;

  currentMatchIndex = index;
  const match = currentMatches[currentMatchIndex];

  setSearchStatus(`Match ${currentMatchIndex + 1} of ${currentMatches.length}: ${match.row.Name || match.row.Location || 'match'}`);

  match.group.zoomToShowLayer(match.marker, function() {
    map.setView(match.marker.getLatLng(), Math.max(map.getZoom(), 8));
    ensurePopup(match.marker, match.row);
    match.marker.openPopup();
  });
}

function runSearch() {
  const input = getSearchInput();
  if (!input) return;

  const query = String(input.value || '').trim().toLowerCase();

  if (!query) {
    currentMatches = [];
    currentMatchIndex = 0;
    setSearchStatus('Enter a name or location.');
    return;
  }

  currentMatches = searchableMarkers.filter(item => {
    const name = String(item.row.Name || '').toLowerCase();
    const location = String(item.row.Location || '').toLowerCase();
    return name.includes(query) || location.includes(query);
  });

  if (!currentMatches.length) {
    currentMatchIndex = 0;
    setSearchStatus('No match found.');
    return;
  }

  showMatch(0);
}

document.addEventListener('click', function(e) {
  if (e.target && e.target.id === 'map-search-toggle') {
    toggleSearchPanel();
  }

  if (e.target && e.target.id === 'map-search-button') {
    runSearch();
  }

  if (e.target && e.target.id === 'map-search-prev') {
    if (currentMatches.length) showMatch(currentMatchIndex - 1);
  }

  if (e.target && e.target.id === 'map-search-next') {
    if (currentMatches.length) showMatch(currentMatchIndex + 1);
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeSearchPanel();
  }

  if (e.target && e.target.id === 'map-search-input' && e.key === 'Enter') {
    e.preventDefault();
    runSearch();
  }
});

map.on('click', function() {
  closeSearchPanel();
});

function buildGroupedVisibleRows(visibleRows) {
  const groupedByCoords = {};

  for (const row of visibleRows) {
    const lat = parseFloat(row.Lat);
    const lng = parseFloat(row.Lng);

    if (isNaN(lat) || isNaN(lng)) continue;

    const key = `${lat.toFixed(6)},${lng.toFixed(6)}`;

    if (!groupedByCoords[key]) {
      groupedByCoords[key] = [];
    }

    groupedByCoords[key].push(row);
  }

  return groupedByCoords;
}

function rowIsVisible(row, bounds) {
  const lat = parseFloat(row.Lat);
  const lng = parseFloat(row.Lng);

  if (isNaN(lat) || isNaN(lng)) return false;

  return bounds.pad(0.15).contains([lat, lng]);
}

function renderVisibleMarkers() {
  if (!allRows.length) return;

  const bounds = map.getBounds();
  const visibleRows = allRows.filter(row => rowIsVisible(row, bounds));
  const groupedByCoords = buildGroupedVisibleRows(visibleRows);

  markersLayer.clearLayers();
  searchableMarkers = [];

  for (const key of Object.keys(groupedByCoords)) {
    const group = groupedByCoords[key];
    const baseLat = parseFloat(group[0].Lat);
    const baseLng = parseFloat(group[0].Lng);

    for (let i = 0; i < group.length; i++) {
      const row = group[i];
      const layer = String(row.Layer || '').trim().toLowerCase();
      const coords = getOffsetCoords(baseLat, baseLng, i, group.length);

      const marker = L.marker(coords, {
        icon: layer === 'kirsties' ? kirstyIcon : supporterIcon
      });

      markersLayer.addLayer(marker);

      marker.on('click', function() {
        ensurePopup(marker, row);
        marker.openPopup();
      });

      marker.on('popupopen', function() {
        if (window.parent) {
          window.parent.postMessage({
            type: 'marker_opened',
            name: row.Name || 'unknown'
          }, '*');
        }
      });

      searchableMarkers.push({
        row: row,
        marker: marker,
        group: markersLayer
      });
    }
  }
}

function scheduleVisibleRender() {
  if (renderTimer) {
    clearTimeout(renderTimer);
  }

  renderTimer = setTimeout(() => {
    renderVisibleMarkers();
  }, 80);
}

async function loadMapData() {
  try {
    const response = await fetch(sheetUrl);
    const rows = await response.json();

    const cleanedRows = rows.slice(1).filter(row => {
      const lat = parseFloat(row.Lat);
      const lng = parseFloat(row.Lng);
      return !isNaN(lat) && !isNaN(lng);
    });

    allRows = cleanedRows;
    currentMatches = [];
    currentMatchIndex = 0;
    setSearchStatus('');

    updateLegendCounts(allRows);

    allDataBounds = L.latLngBounds(
      allRows.map(row => [parseFloat(row.Lat), parseFloat(row.Lng)])
    );

    scheduleVisibleRender();

    if (allRows.length) {
      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    }
  } catch (error) {
    console.error('Error loading map data:', error);
  }
}

map.on('moveend zoomend', scheduleVisibleRender);

window.addEventListener('load', () => {
  setTimeout(() => {
    map.invalidateSize();
  }, 400);
});

loadMapData();
</script>

</body>
</html>
