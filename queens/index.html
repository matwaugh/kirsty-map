  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #F3EEDC;
  }

  :root {
    --teal: #00878B;
    --dark: #59584C;
    --yellow: #FDD197;
    --salmon: #FF756B;
    --cream: #F3EEDC;
  }


  /* =====================================================
     VIEWPORT
     ===================================================== */

  #queensViewport {
    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    cursor: grab;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #queensViewport.dragging {
    cursor: grabbing;
  }

  #queensViewport.overview-active {
    cursor: pointer;
  }


  /* =====================================================
     BOARD
     ===================================================== */

  #queensBoard {
    position: absolute;

    left: 0;
    top: 0;

    display: grid;

    grid-template-columns: repeat(var(--columns), 125px);
    grid-auto-rows: 180px;

    gap: 16px;

    padding: 28px;

    transform-origin: 0 0;
    will-change: transform;
  }


  /* =====================================================
     CARDS
     ===================================================== */

  .queen-card {
    width: 125px;
    height: 180px;

    perspective: 1000px;

    cursor: pointer;
  }

  .queen-card-inner {
    position: relative;

    width: 100%;
    height: 100%;

    transition: transform 0.55s ease;

    transform-style: preserve-3d;
  }

  .queen-card.flipped .queen-card-inner {
    transform: rotateY(180deg);
  }

  .queen-front,
  .queen-back {
    position: absolute;

    inset: 0;

    overflow: hidden;

    border-radius: 8px;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  }


  /* =====================================================
     PHOTO FRONT
     ===================================================== */

  .queen-front.photo-card {
    display: flex;
    flex-direction: column;

    background: var(--yellow);
  }

  .queen-photo {
    flex: 1;

    min-height: 0;

    overflow: hidden;

    background: #ddd;
  }

  .queen-photo img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    pointer-events: none;
  }

  .queen-name {
    min-height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 5px 6px;

    background: var(--yellow);
    color: var(--dark);

    font-size: 13px;
    font-weight: bold;

    text-align: center;
  }


  /* =====================================================
     CROWN FRONT
     ===================================================== */

  .queen-front.crown-card {
    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--salmon);

    box-shadow:
      inset 0 0 0 3px rgba(243,238,220,0.24),
      0 3px 10px rgba(0,0,0,0.12);
  }

  .crown-icon {
    width: 57px;
    height: 50px;

    fill: var(--cream);

    pointer-events: none;
  }

 
.crown-card {
  flex-direction: column;
  gap: 12px;
}

.crown-name {
  color: var(--cream);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
}

@media (max-width: 600px) {
  .crown-card {
    gap: 8px;
  }

  .crown-name {
    font-size: 11px;
  }
}

     CARD BACK
     ===================================================== */

    transform: rotateY(180deg);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 10px;

    background: var(--teal);
    color: white;

    text-align: center;

  .queen-quote {
    width: 100%;

    font-size: 14px;
    line-height: 1.16;

    overflow-wrap: anywhere;
    word-break: normal;

    height: 48px;

     ===================================================== */

    position: fixed;

    left: 50%;
    bottom: 14px;

    transform: translateX(-50%);

    z-index: 90;

    padding: 6px 10px;

    border-radius: 999px;

  if (!usedIds.has(id)) {

    queens.push({

      image: "",

      quote: "",

      crownOnly: true

    });

  }
}

/* =====================================================
   HELPERS
   ===================================================== */

function isMobile() {

  /*
    Use the actual Queens viewport width rather than
    window.matchMedia(). When this page is loaded inside
    the Carrd iframe, the browser can briefly report a
    narrow window while Carrd is still laying the page out.
    Measuring the rendered viewport avoids occasionally
    building the three-row mobile wall on desktop.
  */

  return viewport.clientWidth <= 600;

}


function weightedShuffle(array) {

  return array
    .map(queen => ({

      queen: queen,

      /*
        Photo cards receive four times the weighting
        of crown-only cards.
      */

      order:
        -Math.log(Math.random()) /
        (queen.crownOnly ? 1 : 4)

    }))
    .sort(
      (a, b) =>
        a.order - b.order
    )
    .map(
      item =>
        item.queen
    );

}

function fitQuote(element) {

  if (!element) {
    return;
  }


  const back =
    element.closest(
      ".queen-back"
    );


  if (!back) {
    return;
  }


  const backStyle =
    window.getComputedStyle(
      back
    );


  const availableWidth =
    back.clientWidth -
    parseFloat(backStyle.paddingLeft) -
    parseFloat(backStyle.paddingRight);


  const availableHeight =
    back.clientHeight -
    parseFloat(backStyle.paddingTop) -
    parseFloat(backStyle.paddingBottom);


  const maximumSize =
    isMobile()
      ? 12.5
      : 14;


  const preferredMinimum =
    isMobile()
      ? 8.5
      : 9;


  const absoluteMinimum =
    7.5;


  const lineHeight =
    isMobile()
      ? 1.14
      : 1.16;


  element.style.width =
    `${availableWidth}px`;


  element.style.lineHeight =
    String(lineHeight);


  function fitsAt(size) {

    element.style.fontSize =
      `${size}px`;


    return (
      element.scrollHeight <=
        availableHeight + 0.5 &&
      element.scrollWidth <=
        availableWidth + 0.5
    );

  }


  let low =
    preferredMinimum;

  let high =
    maximumSize;


  if (!fitsAt(low)) {

    low =
      absoluteMinimum;

    high =
      preferredMinimum;

  }


  for (
    let i = 0;
    i < 12;
    i++
  ) {

    const size =
      (low + high) / 2;


    if (fitsAt(size)) {

      low = size;

    } else {

      high = size;

    }

  }


  element.style.fontSize =
    `${low.toFixed(2)}px`;

}


function fitAllQuotes() {

  document
    .querySelectorAll(
      ".queen-quote"
    )
    .forEach(
      fitQuote
    );

}

/* =====================================================
   DESKTOP WALL
   ===================================================== */

function buildDesktopWall(
  kirsty,
  others
) {

  let columns =
    Math.ceil(
      Math.sqrt(
        queens.length
      )
    );


  if (columns % 2 === 0) {
    columns++;
  }


  let rows =
    Math.ceil(
      queens.length /
      columns
    );


  if (rows % 2 === 0) {
    rows++;
  }


  columns += 2;
  rows += 2;


  if (columns % 2 === 0) {
    columns++;
  }


  if (rows % 2 === 0) {
    rows++;
  }


  board.style.setProperty(
    "--columns",
    columns
  );


  const totalSlots =
    columns * rows;


  const centreRow =
    Math.floor(
      rows / 2
    );


  const centreColumn =
    Math.floor(
      columns / 2
    );


  const centreIndex =
    centreRow *
    columns +
    centreColumn;


  const positions = [];


  for (
    let i = 0;
    i < totalSlots;
    i++
  ) {

    if (
      i !== centreIndex
    ) {

      positions.push(i);

    }

  }


  positions.sort(
    (a, b) => {

      const rowA =
        Math.floor(
          a / columns
        );


      const colA =
        a % columns;


      const rowB =
        Math.floor(
          b / columns
        );


      const colB =
        b % columns;


      const distanceA =
        Math.hypot(
          rowA - centreRow,
          colA - centreColumn
        );


      const distanceB =
        Math.hypot(
          rowB - centreRow,
          colB - centreColumn
        );


      return (
        distanceA -
        distanceB +
        (
          Math.random() -
          0.5
        ) * 0.5
      );

    }
  );


  const slots =
    new Array(
      totalSlots
    ).fill(null);


  slots[
    centreIndex
  ] = kirsty;


  others.forEach(
    (queen, index) => {

      slots[
        positions[index]
      ] = queen;

    }
  );


  slots.forEach(
    queen => {

      if (!queen) {

        board.appendChild(
          document.createElement(
            "div"
          )
        );


        return;

      }


      const card =
        createCard(queen);


      board.appendChild(
        card
      );


      if (
        queen.kirsty
      ) {

        centreCard =
          card;

      }

    }
  );

}


/* =====================================================
   MOBILE WALL
   ===================================================== */

function buildMobileWall(
  kirsty,
  others
) {

  const rows = 3;


  let columns =
    Math.ceil(
      queens.length /
      rows
    ) + 2;


  if (
    columns % 2 === 0
  ) {

    columns++;

  }


  board.style.setProperty(
    "--columns",
    columns
  );


  const totalSlots =
    columns * rows;


  const centreColumn =
    Math.floor(
      columns / 2
    );


  const centreRow = 1;


  const centreIndex =
    centreColumn *
    rows +
    centreRow;


  const positions = [];


  for (
    let i = 0;
    i < totalSlots;
    i++
  ) {

    if (
      i !== centreIndex
    ) {

      positions.push(i);

    }

  }


  positions.sort(
    (a, b) => {

      const columnA =
        Math.floor(
          a / rows
        );


      const rowA =
        a % rows;


      const columnB =
        Math.floor(
          b / rows
        );


      const rowB =
        b % rows;


      const distanceA =
        Math.abs(
          columnA -
          centreColumn
        ) +
        Math.abs(
          rowA -
          centreRow
        ) * 0.15;


      const distanceB =
        Math.abs(
          columnB -
          centreColumn
        ) +
        Math.abs(
          rowB -
          centreRow
        ) * 0.15;


      return (
        distanceA -
        distanceB +
        (
          Math.random() -
          0.5
        ) * 0.2
      );

    }
  );


  const slots =
    new Array(
      totalSlots
    ).fill(null);


  slots[
    centreIndex
  ] = kirsty;


  others.forEach(
    (queen, index) => {

      slots[
        positions[index]
      ] = queen;

    }
  );


  slots.forEach(
    queen => {

      if (!queen) {

        board.appendChild(
          document.createElement(
            "div"
          )
        );


        return;

      }


      const card =
        createCard(queen);


      board.appendChild(
        card
      );


      if (
        queen.kirsty
      ) {

        centreCard =
          card;

      }

    }
  );

}

/* =====================================================
   CENTRE ON KIRSTY
   ===================================================== */

function centreOnKirsty() {

  if (!centreCard) {
    return;
  }


  const viewportRect =
    viewport.getBoundingClientRect();


  overviewScale = 1;


  board.style.transform =
    "translate(0px,0px) scale(1)";

    centreCard.getBoundingClientRect();

    viewportRect.width / 2 -

    (
      cardRect.top +
      cardRect.height / 2
    );


  updateBoardPosition();

}


/* =====================================================
   OVERVIEW — SCALABLE CROWN
   ===================================================== */

let crownOverviewCards = null;


/*
   Crown silhouette in normalised 0–1 coordinates.

   The top edge has five points and four valleys.
   The sides taper very slightly, and the lower section
   forms a solid band so the shape reads clearly as a crown.

   These proportions stay the same as the Queen count grows.
*/

function crownTopY(x) {

  const peaks = [
    { x: 0.06, y: 0.28 },
    { x: 0.28, y: 0.10 },
    { x: 0.50, y: 0.02 },
    { x: 0.72, y: 0.10 },
    { x: 0.94, y: 0.28 }
  ];

  const valleys = [
    { x: 0.00, y: 0.34 },
    { x: 0.17, y: 0.48 },
    { x: 0.39, y: 0.43 },
    { x: 0.61, y: 0.43 },
    { x: 0.83, y: 0.48 },
    { x: 1.00, y: 0.34 }
  ];


  const points = [
    valleys[0],
    peaks[0],
    valleys[1],
    peaks[1],
    valleys[2],
    peaks[2],
    valleys[3],
    peaks[3],
    valleys[4],
    peaks[4],
    valleys[5]
  ];


  for (
    let i = 0;
    i < points.length - 1;
    i++
  ) {

    const a = points[i];
    const b = points[i + 1];

    if (
      x >= a.x &&
      x <= b.x
    ) {

      const t =
        (x - a.x) /
        (b.x - a.x);

      return (
        a.y +
        (b.y - a.y) * t
      );

    }

  }

  return 0.34;

}


function crownSideInset(y) {

  /*
     Slight inward taper toward the top.
     The broad lower band remains strong and crown-like.
  */

  if (y >= 0.72) {
    return 0.00;
  }

  const t =
    (0.72 - y) / 0.72;

  return 0.035 * t;

}


function pointInsideCrown(x, y) {

  const top =
    crownTopY(x);

  if (y < top) {
    return false;
  }


  const inset =
    crownSideInset(y);


  if (
    x < inset ||
    x > 1 - inset
  ) {
    return false;
  }


  return true;

}


/*
   Build a virtual grid dense enough to hold every Queen.

   We target roughly a 1.55:1 crown footprint. The algorithm
   increases density until there are enough valid crown cells,
   so this continues to work as the wall grows toward 500.
*/

function generateCrownLayout(count) {

  let columns =
    Math.max(
      19,
      Math.ceil(
        Math.sqrt(count * 2.45)
      )
    );


  if (columns % 2 === 0) {
    columns++;
  }


  while (true) {

    const rows =
      Math.max(
        11,
        Math.round(
          columns / 1.55
        )
      );


    const positions = [];


    for (
      let row = 0;
      row < rows;
      row++
    ) {

      for (
        let column = 0;
        column < columns;
        column++
      ) {

        const x =
          columns === 1
            ? 0.5
            : column /
              (columns - 1);


        const y =
          rows === 1
            ? 0.5
            : row /
              (rows - 1);


        if (
          pointInsideCrown(
            x,
            y
          )
        ) {

          positions.push({

            row: row,
            column: column,
            x: x,
            y: y

          });

        }

      }

    }


    if (
      positions.length >= count
    ) {

      return {

        columns: columns,
        rows: rows,
        positions: positions

      };

    }


    columns += 2;

  }

}


/*
   Score positions by distance from Kirsty's intended centre
   point. Photo Queens get the nearest positions first, while
   crown-only placeholders fill outward from them.

   A small random component stops the arrangement looking
   mechanically concentric.
*/

function distanceFromKirstyPosition(position) {

  const kirstyX = 0.5;
  const kirstyY = 0.69;


  return Math.hypot(
    (position.x - kirstyX) * 1.08,
    (position.y - kirstyY)
  );

}


function shuffledCopy(array) {

  const result =
    array.slice();


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    const temp =
      result[i];

    result[i] =
      result[j];

    result[j] =
      temp;

  }


  return result;

}


function buildCrownOverviewCards() {

  const cards =
    Array.from(
      board.querySelectorAll(
        ".queen-card"
      )
    );


  const kirstyCard =
    cards.find(
      card =>
        card.classList.contains(
          "kirsty"
        )
    );


  const photoCards =
    shuffledCopy(
      cards.filter(
        card =>
          !card.classList.contains("kirsty") &&
          !!card.querySelector(
            ".photo-card"
          )
      )
    );


  const crownCards =
    shuffledCopy(
      cards.filter(
        card =>
          !card.classList.contains("kirsty") &&
          !!card.querySelector(
            ".crown-card"
          )
      )
    );


  return {

    all: cards,
    kirsty: kirstyCard,
    photos: photoCards,
    crowns: crownCards

  };

}


function arrangeCrownOverview() {

  if (!crownOverviewCards) {
    crownOverviewCards =
      buildCrownOverviewCards();
  }


  const cardCount =
    crownOverviewCards.all.length;


  const layout =
    generateCrownLayout(
      cardCount
    );


  const sortedPositions =
    layout.positions
      .slice()
      .sort(
        (a, b) =>
          distanceFromKirstyPosition(a) -
          distanceFromKirstyPosition(b)
      );


  /*
     Put Kirsty closest to the visual centre of the crown.
  */

  const kirstyPosition =
    sortedPositions[0];


  const remainingPositions =
    sortedPositions.slice(1);


  /*
     Photo Queens should tend to cluster around Kirsty as before,
     but not form one rigid block. Give them the nearer pool,
     then shuffle within that pool.
  */

  const photoCount =
    crownOverviewCards.photos.length;


  const nearPoolSize =
    Math.min(
      remainingPositions.length,
      Math.max(
        photoCount,
        Math.round(
          photoCount * 1.75
        )
      )
    );


  const nearPool =
    shuffledCopy(
      remainingPositions.slice(
        0,
        nearPoolSize
      )
    );


  const farPool =
    shuffledCopy(
      remainingPositions.slice(
        nearPoolSize
      )
    );


  const photoPositions =
    nearPool.splice(
      0,
      photoCount
    );


  const crownPositions =
    shuffledCopy(
      nearPool.concat(
        farPool
      )
    );


  const placements = [];


  if (
    crownOverviewCards.kirsty &&
    kirstyPosition
  ) {

    placements.push({

      card:
        crownOverviewCards.kirsty,

      position:
        kirstyPosition

    });

  }


  crownOverviewCards.photos
    .forEach(
      (card, index) => {

        if (
          photoPositions[index]
        ) {

          placements.push({

            card: card,
            position:
              photoPositions[index]

          });

        }

      }
    );


  crownOverviewCards.crowns
    .forEach(
      (card, index) => {

        if (
          crownPositions[index]
        ) {

          placements.push({

            card: card,
            position:
              crownPositions[index]

          });

        }

      }
    );


  /*
     Rebuild the board as an explicit crown-shaped CSS grid.
  */

  board.innerHTML = "";


  board.style.setProperty(
    "--columns",
    layout.columns
  );


  board.style.gridTemplateColumns =
    `repeat(${layout.columns}, ${isMobile() ? 100 : 125}px)`;


  board.style.gridTemplateRows =
    `repeat(${layout.rows}, ${isMobile() ? 135 : 180}px)`;


  board.style.gridAutoFlow =
    "row";


  board.style.gridAutoColumns =
    "initial";


  board.style.gridAutoRows =
    "initial";


  board.style.gap =
    isMobile()
      ? "7px"
      : "10px";


  board.style.padding =
    isMobile()
      ? "8px"
      : "12px";


  placements.forEach(
    item => {

      const card =
        item.card;


      card.style.gridColumn =
        String(
          item.position.column + 1
        );


      card.style.gridRow =
        String(
          item.position.row + 1
        );


      board.appendChild(
        card
      );

    }
  );


  centreCard =
    crownOverviewCards.kirsty;


  requestAnimationFrame(
    function() {

      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      const boardWidth =
        board.scrollWidth;


      const boardHeight =
        board.scrollHeight;


      const padding =
        isMobile()
          ? 12
          : 20;


      overviewScale =
        Math.min(
          (viewportWidth - padding * 2) /
            boardWidth,

          (viewportHeight - padding * 2) /
            boardHeight,

          1
        );


      offsetX =
        (
          viewportWidth -
          boardWidth *
          overviewScale
        ) / 2;


      offsetY =
        (
          viewportHeight -
          boardHeight *
          overviewScale
        ) / 2;


      updateBoardPosition();

    }
  );

}


function showOverview(savePosition = true) {

  if (savePosition) {

    savedOffsetX =
      offsetX;

    savedOffsetY =
      offsetY;

  }


  overviewMode = true;


  viewport.classList.add(
    "overview-active"
  );


  board.classList.remove(
    "overview-grid"
  );


  crownOverviewCards =
    buildCrownOverviewCards();


  arrangeCrownOverview();


  overviewButton.textContent =
    "Back to explore";


  dragHint.classList.add(
    "hidden"
  );


  centreButton.classList.remove(
    "visible"
  );


  overviewButton.classList.add(
    "visible"
  );

}


function hideOverview() {

  overviewMode = false;


  viewport.classList.remove(
    "overview-active"
  );


  crownOverviewCards = null;


  /*
     Rebuild the normal explore wall so all of its normal
     desktop/mobile grid rules are restored cleanly.
  */

  buildWall();


  requestAnimationFrame(
    function() {

      offsetX =
        savedOffsetX;

      offsetY =
        savedOffsetY;


      updateBoardPosition();


      overviewButton.textContent =
        "See all";


      overviewButton.classList.add(
        "visible"
      );


      centreButton.classList.add(
        "visible"
      );


      dragHint.classList.add(
        "hidden"
      );

    }
  );

}


/* =====================================================
   POINTER DOWN
   ===================================================== */

viewport.addEventListener(
  "pointerdown",
  function(event) {

    /*
      In overview, any click/tap returns
      to normal explore mode.
    */

    if (overviewMode) {

      hideOverview();

      return;

    }


    dragging = true;

    movedDuringDrag = false;

    horizontalGesture = false;


    activePointerId =
      event.pointerId;


    dragStartX =
      event.clientX;


    dragStartY =
      event.clientY;


    startOffsetX =
      offsetX;


    startOffsetY =
      offsetY;

  }
);


/* =====================================================
   POINTER MOVE
   ===================================================== */

viewport.addEventListener(
  "pointermove",
  function(event) {

    if (!dragging) {
      return;
    }


    const dx =
      event.clientX -
      dragStartX;


    const dy =
      event.clientY -
      dragStartY;


    /* =================================================
       MOBILE
       ================================================= */

    if (isMobile()) {


      if (!horizontalGesture) {


        if (
          Math.abs(dy) > 8 &&
          Math.abs(dy) >
          Math.abs(dx)
        ) {

          dragging = false;

          return;

        }


        if (
          Math.abs(dx) > 8 &&
          Math.abs(dx) >
          Math.abs(dy)
        ) {

          horizontalGesture =
            true;


          movedDuringDrag =
            true;


          viewport.classList.add(
            "dragging"
          );


          showExploringState();


          try {

            viewport.setPointerCapture(
              activePointerId
            );

          } catch (e) {}

        }

      }


      if (
        !horizontalGesture
      ) {

        return;

      }


      offsetX =
        startOffsetX + dx;


      updateBoardPosition();


      return;

    }


    /* =================================================
       DESKTOP
       ================================================= */

    if (
      Math.abs(dx) > 5 ||
      Math.abs(dy) > 5
    ) {


      if (
        !movedDuringDrag
      ) {

        try {

          viewport.setPointerCapture(
            activePointerId
          );

        } catch (e) {}

      }


      movedDuringDrag =
        true;


      viewport.classList.add(
        "dragging"
      );


      showExploringState();

    }


    offsetX =
      startOffsetX + dx;


    offsetY =
      startOffsetY + dy;


    updateBoardPosition();

  }
);


/* =====================================================
   POINTER UP
   ===================================================== */

viewport.addEventListener(
  "pointerup",
  function(event) {

    if (
      !dragging &&
      !horizontalGesture
    ) {

      return;

    }


    const wasDragging =
      movedDuringDrag;


    dragging = false;

    horizontalGesture = false;


    viewport.classList.remove(
      "dragging"
    );


    if (!wasDragging) {


      const elementUnderPointer =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );


      const card =
        elementUnderPointer
          ? elementUnderPointer.closest(
              ".queen-card"
            )
          : null;


      if (card) {

        card.classList.toggle(
          "flipped"
        );

      }

    }


    movedDuringDrag =
      false;


    activePointerId =
      null;

  }
);


/* =====================================================
   POINTER CANCEL
   ===================================================== */

viewport.addEventListener(
  "pointercancel",
  function() {

    dragging = false;

    movedDuringDrag = false;

    horizontalGesture = false;

    activePointerId = null;


    viewport.classList.remove(
      "dragging"
    );

  }
);


/* =====================================================
   SEE ALL
   ===================================================== */

overviewButton.addEventListener(
  "pointerdown",
  function(event) {

    event.stopPropagation();

  }
);


overviewButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    if (overviewMode) {

      hideOverview();

    } else {

      showOverview();

    }

  }
);


/* =====================================================
   BACK TO QUEEN KIRSTY
   ===================================================== */

centreButton.addEventListener(
  "pointerdown",
  function(event) {

    event.stopPropagation();

  }
);


centreButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    centreOnKirsty();


    showHomeState();

  }
);


/* =====================================================
   RESIZE
   ===================================================== */

let lastMobileState = null;

let resizeTimer = null;


function refreshLayout() {

  const newMobileState =
    isMobile();


  /*
    Rebuild if this is the first reliable measurement,
    or if the actual viewport width has crossed the
    600px desktop/mobile breakpoint.
  */

  if (
    lastMobileState === null ||
    newMobileState !== lastMobileState
  ) {

    lastMobileState =
      newMobileState;


    hasStartedExploring = false;


    buildWall();

    return;

  }


  /*
    Same layout mode, but dimensions may have changed.
    Re-centre or recalculate the overview and then
    refit the quote text.
  */

  if (overviewMode) {

    arrangeCrownOverview();

  } else {

    centreOnKirsty();

  }


  requestAnimationFrame(
    fitAllQuotes
  );

}


window.addEventListener(
  "resize",
  function() {

    /*
      Carrd can resize the iframe several times while
      laying out the page. Debouncing prevents us from
      rebuilding against a transient intermediate width.
    */

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        refreshLayout,
        120
      );

  }
);


/*
  ResizeObserver watches the actual Queens viewport.
  This is more reliable than the window resize event
  when Carrd changes the iframe dimensions.
*/

if ("ResizeObserver" in window) {

  const viewportObserver =
    new ResizeObserver(
      function() {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            refreshLayout,
            120
          );

      }
    );


  viewportObserver.observe(
    viewport
  );

}


/* =====================================================
   START
   ===================================================== */

/*
  Wait for Carrd/iframe layout to settle before choosing
  desktop or mobile for the first time.
*/

requestAnimationFrame(
  function() {

    requestAnimationFrame(
      function() {

        refreshLayout();

      }
    );

  }
);

</script>

</body>
