<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kirsty's Queens</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #F3EEDC;
  }

  :root {
    --teal: #00878B;
    --dark: #59584C;
    --yellow: #FDD197;
    --salmon: #FF756B;
    --cream: #F3EEDC;
  }


  /* =====================================================
     VIEWPORT
     ===================================================== */

  #queensViewport {
    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    cursor: grab;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #queensViewport.dragging {
    cursor: grabbing;
  }


  /* =====================================================
     BOARD
     ===================================================== */

  #queensBoard {
    position: absolute;

    left: 0;
    top: 0;

    display: grid;

    grid-template-columns: repeat(var(--columns), 125px);
    grid-auto-rows: 180px;

    gap: 16px;

    padding: 28px;

    transform-origin: 0 0;
    will-change: transform;
  }


  /* =====================================================
     CARDS
     ===================================================== */

  .queen-card {
    width: 125px;
    height: 180px;

    perspective: 1000px;

    cursor: pointer;
  }

  .queen-card-inner {
    position: relative;

    width: 100%;
    height: 100%;

    transition: transform 0.55s ease;

    transform-style: preserve-3d;
  }

  .queen-card.flipped .queen-card-inner {
    transform: rotateY(180deg);
  }

  .queen-front,
  .queen-back {
    position: absolute;

    inset: 0;

    overflow: hidden;

    border-radius: 8px;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  }


  /* =====================================================
     PHOTO FRONT
     ===================================================== */

  .queen-front.photo-card {
    display: flex;
    flex-direction: column;

    background: var(--yellow);
  }

  .queen-photo {
    flex: 1;

    min-height: 0;

    overflow: hidden;

    background: #ddd;
  }

  .queen-photo img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    pointer-events: none;
  }

  .queen-name {
    min-height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 5px 6px;

    background: var(--yellow);
    color: var(--dark);

    font-size: 13px;
    font-weight: bold;

    text-align: center;
  }


  /* =====================================================
     CROWN FRONT
     ===================================================== */

  .queen-front.crown-card {
    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--salmon);

    box-shadow:
      inset 0 0 0 3px rgba(243,238,220,0.24),
      0 3px 10px rgba(0,0,0,0.12);
  }

  .crown-icon {
    width: 57px;
    height: 50px;

    fill: var(--cream);

    pointer-events: none;
  }


  /* =====================================================
     CARD BACK
     ===================================================== */

  .queen-back {
    transform: rotateY(180deg);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 14px;

    background: var(--teal);
    color: white;

    text-align: center;
  }

  .queen-quote {
    font-size: 12.5px;
    line-height: 1.32;
  }

  .queen-quote.long {
    font-size: 11px;
    line-height: 1.28;
  }

  .queen-quote.very-long {
    font-size: 9.8px;
    line-height: 1.22;
  }

  .queen-back-name {
    margin-top: 9px;

    font-size: 11px;
    font-weight: bold;
  }

  .heart-icon {
    width: 48px;
    height: 48px;

    fill: var(--cream);

    pointer-events: none;
  }


  /* =====================================================
     CENTRAL KIRSTY
     ===================================================== */

  .queen-card.kirsty .queen-front,
  .queen-card.kirsty .queen-back {
    box-shadow:
      0 0 0 3px var(--teal),
      0 4px 14px rgba(0,0,0,0.18);
  }


  /* =====================================================
     INSTRUCTION
     ===================================================== */

  #dragHint {
    position: fixed;

    left: 50%;
    bottom: 14px;

    transform: translateX(-50%);

    z-index: 90;

    padding: 6px 10px;

    border-radius: 999px;

    background: rgba(243,238,220,0.92);
    color: var(--dark);

    font-size: 11px;

    white-space: nowrap;

    pointer-events: none;

    opacity: 1;

    transition: opacity 0.25s ease;
  }

  #dragHint.hidden {
    opacity: 0;
  }

  .mobileHint {
    display: none;
  }


  /* =====================================================
     BACK TO KIRSTY BUTTON
     ===================================================== */

  #centreButton {
    position: fixed;

    right: 14px;
    bottom: 14px;

    z-index: 100;

    border: 0;

    border-radius: 999px;

    padding: 9px 14px;

    background: var(--dark);
    color: white;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;

    cursor: pointer;

    box-shadow: 0 2px 7px rgba(0,0,0,0.2);

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.25s ease;
  }

  #centreButton.visible {
    opacity: 1;

    pointer-events: auto;
  }


  /* =====================================================
     MOBILE
     ===================================================== */

  @media (max-width: 600px) {

    /*
      Permit vertical page gestures where the browser
      allows them, while our JS only moves the wall
      horizontally.
    */

    #queensViewport {
      touch-action: pan-y;
    }


    /*
      Three-row wall extending sideways.
    */

    #queensBoard {
      grid-template-columns: repeat(var(--columns), 100px);

      grid-template-rows: repeat(3, 135px);

      grid-auto-flow: column;
      grid-auto-columns: 100px;

      gap: 10px;

      padding: 12px;
    }

    .queen-card {
      width: 100px;
      height: 135px;
    }

    .queen-name {
      min-height: 28px;

      padding: 4px;

      font-size: 11px;
    }

    .queen-back {
      padding: 9px;
    }

    .queen-quote {
      font-size: 9.5px;
      line-height: 1.2;
    }

    .queen-quote.long {
      font-size: 8.3px;
      line-height: 1.16;
    }

    .queen-quote.very-long {
      font-size: 7.5px;
      line-height: 1.13;
    }

    .queen-back-name {
      margin-top: 5px;

      font-size: 8.5px;
    }

    .crown-icon {
      width: 44px;
      height: 38px;
    }

    .heart-icon {
      width: 38px;
      height: 38px;
    }

    #dragHint {
      bottom: 10px;

      font-size: 9.5px;
    }

    #centreButton {
      right: 10px;
      bottom: 10px;

      padding: 7px 10px;

      font-size: 10px;
    }

    .desktopHint {
      display: none;
    }

    .mobileHint {
      display: inline;
    }
  }
</style>
</head>

<body>

<div id="queensViewport">
  <div id="queensBoard"></div>
</div>


<div id="dragHint">

  <span class="desktopHint">
    Drag to explore • Click a Queen
  </span>

  <span class="mobileHint">
    Swipe sideways • Tap a Queen
  </span>

</div>


<button
  id="centreButton"
  type="button"
>
  Back to Queen Kirsty
</button>


<script>

/* =====================================================
   TOTAL NUMBER OF TILES

   49 = Kirsty + 48 Queens

   Increase this number when another Queen joins.
   ===================================================== */

const totalQueens = 74;


/* =====================================================
   ICONS
   ===================================================== */

const crownSVG = `
<svg
  class="crown-icon"
  viewBox="0 0 120 100"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <circle cx="18" cy="22" r="7"/>
  <circle cx="60" cy="10" r="7"/>
  <circle cx="102" cy="22" r="7"/>

  <path d="
    M15 32
    L36 57
    L59 22
    L83 57
    L105 32
    L96 78
    L24 78
    Z
  "/>

  <rect
    x="24"
    y="82"
    width="72"
    height="10"

  />
</svg>
`;


const heartSVG = `
<svg
  class="heart-icon"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <path d="
    M50 88
    C44 80 18 61 10 46
    C0 27 11 12 28 12
    C39 12 46 19 50 27
    C54 19 61 12 72 12
    C89 12 100 27 90 46
    C82 61 56 80 50 88
    Z
  "/>
</svg>
`;


/* =====================================================
   PHOTOGRAPHED QUEENS
   ===================================================== */

const queens = [

  {
    id: "Q001",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738116/Q001_Kirsty_Portrait_dwgqzg.jpg",
    quote: "I'm Kirsty, and these are my Queens! Please will you join us?",
    kirsty: true
  },

  {
    id: "Q002",
    name: "Anne",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738116/Q002_Anne_nwkfry.jpg",
    quote: ""
  },

  {
    id: "Q003",
    name: "Kirstie",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738117/Q003_KirstieL_kfc4fq.jpg",
    quote: ""
  },

  {
    id: "Q004",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738118/Q004_KirstyA_ne1w9w.jpg",
    quote: "All Kirstys are ace but one Kirsty who is just a bit more wonderful than all the rest. If I can help this beautiful girl fundraise then I will do all I can."
  },

  {
    id: "Q005",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738214/Q005_Kirsty_qts7pf.jpg",
    quote: ""
  },

  {
    id: "Q006",
    name: "Hayley",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738119/Q006_Hayley_xgxap5.jpg",
    quote: ""
  },

  {
    id: "Q007",
    name: "Chris",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738120/Q007_ChrisF_hzkpsk.jpg",
    quote: ""
  },

  {
    id: "Q008",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738130/Q008_KirstyB_uvmwpz.jpg",
    quote: ""
  },

  {
    id: "Q009",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738212/Q009_KirstyE_irndpk.png",
    quote: ""
  },

  {
    id: "Q010",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738121/Q010_KirstyF_dkwd4c.png",
    quote: ""
  },

  {
    id: "Q011",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738211/Q011_KirstyO_krokbu.jpg",
    quote: ""
  },

  {
    id: "Q012",
    name: "Shazia",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738122/Q012_Shazia_kghegv.jpg",
    quote: "Proud to be supporting Kirsty, an incredible young lady raising funding for much-needed brain tumour research."
  },

  {
    id: "Q013",
    name: "Soo",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738123/Q013_SooS_l9n915.jpg",
    quote: "I’ve known a few people with brain tumours but none as young as Kirsty. When I heard her story I thought it was really time things changed."
  },

  {
    id: "Q014",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738124/Q014_KirstyS_fjcxgl.jpg",
    quote: ""
  },

 {
    id: "Q015",
    name: "Jane",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789932460/Q015_JaneH_vva3bf.jpg",
    quote: ""
  }

];


/* =====================================================
   AUTOMATIC CROWN-ONLY QUEENS
   ===================================================== */

const usedIds =
  new Set(
    queens.map(
      queen => queen.id
    )
  );


for (
  let i = 1;
  i <= totalQueens;
  i++
) {

  const id =
    `Q${String(i).padStart(3, "0")}`;


  if (!usedIds.has(id)) {

    queens.push({

      id: id,

      name: "",

      image: "",

      quote: "",

      crownOnly: true

    });

  }
}


/* =====================================================
   ELEMENTS / STATE
   ===================================================== */

const viewport =
  document.getElementById(
    "queensViewport"
  );


const board =
  document.getElementById(
    "queensBoard"
  );


const centreButton =
  document.getElementById(
    "centreButton"
  );


const dragHint =
  document.getElementById(
    "dragHint"
  );


let offsetX = 0;
let offsetY = 0;

let dragStartX = 0;
let dragStartY = 0;

let startOffsetX = 0;
let startOffsetY = 0;

let dragging = false;

let movedDuringDrag = false;

let horizontalGesture = false;

let activePointerId = null;

let centreCard = null;


/* =====================================================
   HELPERS
   ===================================================== */

function isMobile() {

  return window.matchMedia(
    "(max-width: 600px)"
  ).matches;

}


function shuffle(array) {

  const copy =
    [...array];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


function getQuoteClass(quote) {

  if (!quote) {
    return "queen-quote";
  }


  if (quote.length > 220) {
    return "queen-quote very-long";
  }


  if (quote.length > 150) {
    return "queen-quote long";
  }


  return "queen-quote";

}


/* =====================================================
   UI STATES
   ===================================================== */

function showExploringState() {

  dragHint.classList.add(
    "hidden"
  );


  centreButton.classList.add(
    "visible"
  );

}


function showHomeState() {

  dragHint.classList.remove(
    "hidden"
  );


  centreButton.classList.remove(
    "visible"
  );

}


/* =====================================================
   CREATE CARD
   ===================================================== */

function createCard(queen) {

  const card =
    document.createElement("div");


  card.className =
    "queen-card" +
    (
      queen.kirsty
        ? " kirsty"
        : ""
    );


  let frontHTML = "";


  if (queen.crownOnly) {

    frontHTML = `
      <div class="queen-front crown-card">
        ${crownSVG}
      </div>
    `;

  } else {

    frontHTML = `
      <div class="queen-front photo-card">

        <div class="queen-photo">

          <img
            src="${queen.image}"
            alt="${queen.name}"
            loading="lazy"
          >

        </div>

        <div class="queen-name">
          ${queen.name}
        </div>

      </div>
    `;

  }


  let backHTML = "";


  if (queen.quote) {

    const quoteClass =
      getQuoteClass(
        queen.quote
      );


    backHTML = `
      <div class="queen-back">

        <div class="${quoteClass}">
          “${queen.quote}”
        </div>

        <div class="queen-back-name">
          ${queen.name}
        </div>

      </div>
    `;

  } else {

    backHTML = `
      <div class="queen-back">
        ${heartSVG}
      </div>
    `;

  }


  card.innerHTML = `
    <div class="queen-card-inner">
      ${frontHTML}
      ${backHTML}
    </div>
  `;


  return card;

}


/* =====================================================
   DESKTOP WALL
   ===================================================== */

function buildDesktopWall(
  kirsty,
  others
) {

  let columns =
    Math.ceil(
      Math.sqrt(
        queens.length
      )
    );


  if (columns % 2 === 0) {
    columns++;
  }


  let rows =
    Math.ceil(
      queens.length /
      columns
    );


  if (rows % 2 === 0) {
    rows++;
  }


  columns += 2;
  rows += 2;


  if (columns % 2 === 0) {
    columns++;
  }


  if (rows % 2 === 0) {
    rows++;
  }


  board.style.setProperty(
    "--columns",
    columns
  );


  const totalSlots =
    columns * rows;


  const centreRow =
    Math.floor(
      rows / 2
    );


  const centreColumn =
    Math.floor(
      columns / 2
    );


  const centreIndex =
    centreRow *
    columns +
    centreColumn;


  const positions = [];


  for (
    let i = 0;
    i < totalSlots;
    i++
  ) {

    if (
      i !== centreIndex
    ) {

      positions.push(i);

    }

  }


  positions.sort(
    (a, b) => {

      const rowA =
        Math.floor(
          a / columns
        );


      const colA =
        a % columns;


      const rowB =
        Math.floor(
          b / columns
        );


      const colB =
        b % columns;


      const distanceA =
        Math.hypot(
          rowA - centreRow,
          colA - centreColumn
        );


      const distanceB =
        Math.hypot(
          rowB - centreRow,
          colB - centreColumn
        );


      return (
        distanceA -
        distanceB +
        (
          Math.random() -
          0.5
        ) * 0.5
      );

    }
  );


  const slots =
    new Array(
      totalSlots
    ).fill(null);


  slots[
    centreIndex
  ] = kirsty;


  others.forEach(
    (queen, index) => {

      slots[
        positions[index]
      ] = queen;

    }
  );


  slots.forEach(
    queen => {

      if (!queen) {

        board.appendChild(
          document.createElement(
            "div"
          )
        );


        return;

      }


      const card =
        createCard(queen);


      board.appendChild(
        card
      );


      if (
        queen.kirsty
      ) {

        centreCard =
          card;

      }

    }
  );

}


/* =====================================================
   MOBILE WALL
   ===================================================== */

function buildMobileWall(
  kirsty,
  others
) {

  const rows = 3;


  let columns =
    Math.ceil(
      queens.length /
      rows
    ) + 2;


  if (
    columns % 2 === 0
  ) {

    columns++;

  }


  board.style.setProperty(
    "--columns",
    columns
  );


  const totalSlots =
    columns * rows;


  const centreColumn =
    Math.floor(
      columns / 2
    );


  const centreRow = 1;


  /*
    Grid fills vertically first:
    column × 3 + row.
  */

  const centreIndex =
    centreColumn *
    rows +
    centreRow;


  const positions = [];


  for (
    let i = 0;
    i < totalSlots;
    i++
  ) {

    if (
      i !== centreIndex
    ) {

      positions.push(i);

    }

  }


  positions.sort(
    (a, b) => {

      const columnA =
        Math.floor(
          a / rows
        );


      const rowA =
        a % rows;


      const columnB =
        Math.floor(
          b / rows
        );


      const rowB =
        b % rows;


      const distanceA =
        Math.abs(
          columnA -
          centreColumn
        ) +
        Math.abs(
          rowA -
          centreRow
        ) * 0.15;


      const distanceB =
        Math.abs(
          columnB -
          centreColumn
        ) +
        Math.abs(
          rowB -
          centreRow
        ) * 0.15;


      return (
        distanceA -
        distanceB +
        (
          Math.random() -
          0.5
        ) * 0.2
      );

    }
  );


  const slots =
    new Array(
      totalSlots
    ).fill(null);


  slots[
    centreIndex
  ] = kirsty;


  others.forEach(
    (queen, index) => {

      slots[
        positions[index]
      ] = queen;

    }
  );


  slots.forEach(
    queen => {

      if (!queen) {

        board.appendChild(
          document.createElement(
            "div"
          )
        );


        return;

      }


      const card =
        createCard(queen);


      board.appendChild(
        card
      );


      if (
        queen.kirsty
      ) {

        centreCard =
          card;

      }

    }
  );

}


/* =====================================================
   BUILD WALL
   ===================================================== */

function buildWall() {

  board.innerHTML = "";

  centreCard = null;


  const kirsty =
    queens.find(
      queen =>
        queen.kirsty
    );


  const others =
    shuffle(
      queens.filter(
        queen =>
          !queen.kirsty
      )
    );


  if (isMobile()) {

    buildMobileWall(
      kirsty,
      others
    );

  } else {

    buildDesktopWall(
      kirsty,
      others
    );

  }


  showHomeState();


  requestAnimationFrame(
    centreOnKirsty
  );

}


/* =====================================================
   POSITION
   ===================================================== */

function updateBoardPosition() {

  board.style.transform =
    `translate(${offsetX}px, ${offsetY}px)`;

}


/* =====================================================
   CENTRE ON KIRSTY
   ===================================================== */

function centreOnKirsty() {

  if (!centreCard) {
    return;
  }


  const viewportRect =
    viewport.getBoundingClientRect();


  board.style.transform =
    "translate(0px,0px)";


  const cardRect =
    centreCard.getBoundingClientRect();


  offsetX =
    viewportRect.width / 2 -
    (
      cardRect.left +
      cardRect.width / 2
    );


  offsetY =
    viewportRect.height / 2 -
    (
      cardRect.top +
      cardRect.height / 2
    );


  updateBoardPosition();

}


/* =====================================================
   POINTER DOWN
   ===================================================== */

viewport.addEventListener(
  "pointerdown",
  function(event) {

    dragging = true;

    movedDuringDrag = false;

    horizontalGesture = false;


    activePointerId =
      event.pointerId;


    dragStartX =
      event.clientX;


    dragStartY =
      event.clientY;


    startOffsetX =
      offsetX;


    startOffsetY =
      offsetY;

  }
);


/* =====================================================
   POINTER MOVE
   ===================================================== */

viewport.addEventListener(
  "pointermove",
  function(event) {

    if (!dragging) {
      return;
    }


    const dx =
      event.clientX -
      dragStartX;


    const dy =
      event.clientY -
      dragStartY;


    /* =================================================
       MOBILE
       ================================================= */

    if (isMobile()) {


      /*
        Determine intended direction first.
      */

      if (!horizontalGesture) {


        /*
          Predominantly vertical:
          abandon wall dragging.
        */

        if (
          Math.abs(dy) > 8 &&
          Math.abs(dy) >
          Math.abs(dx)
        ) {

          dragging = false;

          return;

        }


        /*
          Predominantly horizontal:
          begin wall drag.
        */

        if (
          Math.abs(dx) > 8 &&
          Math.abs(dx) >
          Math.abs(dy)
        ) {

          horizontalGesture =
            true;


          movedDuringDrag =
            true;


          viewport.classList.add(
            "dragging"
          );


          showExploringState();


          try {

            viewport.setPointerCapture(
              activePointerId
            );

          } catch (e) {}

        }

      }


      if (
        !horizontalGesture
      ) {

        return;

      }


      /*
        Mobile changes X only.
      */

      offsetX =
        startOffsetX + dx;


      updateBoardPosition();


      return;

    }


    /* =================================================
       DESKTOP
       ================================================= */

    if (
      Math.abs(dx) > 5 ||
      Math.abs(dy) > 5
    ) {


      if (
        !movedDuringDrag
      ) {

        try {

          viewport.setPointerCapture(
            activePointerId
          );

        } catch (e) {}

      }


      movedDuringDrag =
        true;


      viewport.classList.add(
        "dragging"
      );


      showExploringState();

    }


    offsetX =
      startOffsetX + dx;


    offsetY =
      startOffsetY + dy;


    updateBoardPosition();

  }
);


/* =====================================================
   POINTER UP
   ===================================================== */

viewport.addEventListener(
  "pointerup",
  function(event) {

    if (
      !dragging &&
      !horizontalGesture
    ) {

      return;

    }


    const wasDragging =
      movedDuringDrag;


    dragging = false;

    horizontalGesture = false;


    viewport.classList.remove(
      "dragging"
    );


    /*
      If there was no meaningful movement,
      treat it as a tap/click and flip the card.
    */

    if (!wasDragging) {


      const elementUnderPointer =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );


      const card =
        elementUnderPointer
          ? elementUnderPointer.closest(
              ".queen-card"
            )
          : null;


      if (card) {

        card.classList.toggle(
          "flipped"
        );

      }

    }


    movedDuringDrag =
      false;


    activePointerId =
      null;

  }
);


/* =====================================================
   POINTER CANCEL
   ===================================================== */

viewport.addEventListener(
  "pointercancel",
  function() {

    dragging = false;

    movedDuringDrag = false;

    horizontalGesture = false;

    activePointerId = null;


    viewport.classList.remove(
      "dragging"
    );

  }
);


/* =====================================================
   BACK TO QUEEN KIRSTY
   ===================================================== */

centreButton.addEventListener(
  "pointerdown",
  function(event) {

    event.stopPropagation();

  }
);


centreButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    centreOnKirsty();


    showHomeState();

  }
);


/* =====================================================
   RESIZE
   ===================================================== */

let lastMobileState =
  isMobile();


window.addEventListener(
  "resize",
  function() {

    const newMobileState =
      isMobile();


    if (
      newMobileState !==
      lastMobileState
    ) {

      lastMobileState =
        newMobileState;


      buildWall();

    } else {

      centreOnKirsty();

    }

  }
);


/* =====================================================
   START
   ===================================================== */

buildWall();

</script>

</body>
</html>
