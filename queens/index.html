<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kirsty's Queens</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #F3EEDC;
  }

  :root {
    --teal: #00878B;
    --dark: #59584C;
    --yellow: #FDD197;
    --salmon: #FF756B;
    --cream: #F3EEDC;
  }

  #queensViewport {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  #queensViewport.dragging {
    cursor: grabbing;
  }

  #queensBoard {
    position: absolute;
    left: 0;
    top: 0;
    display: grid;
    grid-template-columns: repeat(var(--columns), 150px);
    grid-auto-rows: 190px;
    gap: 18px;
    padding: 40px;
    transform-origin: 0 0;
    will-change: transform;
  }

  .queen-card {
    width: 150px;
    height: 190px;
    perspective: 1000px;
    cursor: pointer;
  }

  .queen-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s ease;
    transform-style: preserve-3d;
  }

  .queen-card.flipped .queen-card-inner {
    transform: rotateY(180deg);
  }

  .queen-front,
  .queen-back {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 9px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.13);
  }

  .queen-front.photo-card {
    display: flex;
    flex-direction: column;
    background: var(--yellow);
  }

  .queen-photo {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #ddd;
  }

  .queen-photo img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    pointer-events: none;
  }

  .queen-name {
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px;
    background: var(--yellow);
    color: var(--dark);
    font-size: 15px;
    font-weight: bold;
    text-align: center;
  }

  .queen-front.crown-card {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--salmon);
  }

  .crown-icon {
    width: 82px;
    height: 70px;
    fill: var(--cream);
    pointer-events: none;
  }

  .queen-back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--teal);
    color: white;
    text-align: center;
  }

  .queen-quote {
    font-size: 14px;
    line-height: 1.35;
  }

  .queen-quote.long {
    font-size: 12.5px;
    line-height: 1.3;
  }

  .queen-quote.very-long {
    font-size: 11px;
    line-height: 1.25;
  }

  .queen-back-name {
    margin-top: 12px;
    font-size: 13px;
    font-weight: bold;
  }

  .heart-icon {
    width: 58px;
    height: 58px;
    fill: var(--cream);
    pointer-events: none;
  }

  .queen-card.kirsty .queen-front,
  .queen-card.kirsty .queen-back {
    box-shadow:
      0 0 0 4px var(--teal),
      0 5px 18px rgba(0,0,0,0.18);
  }

  #centreButton {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 100;
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    background: var(--dark);
    color: white;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  #dragHint {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 90;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(243,238,220,0.92);
    color: var(--dark);
    font-size: 12px;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  #dragHint.hidden {
    opacity: 0;
  }

  @media (max-width: 600px) {
    #queensBoard {
      grid-template-columns: repeat(var(--columns), 125px);
      grid-auto-rows: 160px;
      gap: 14px;
      padding: 30px;
    }

    .queen-card {
      width: 125px;
      height: 160px;
    }

    .queen-name {
      min-height: 36px;
      font-size: 13px;
    }

    .queen-quote {
      font-size: 12px;
      line-height: 1.3;
    }

    .queen-quote.long {
      font-size: 10.5px;
      line-height: 1.25;
    }

    .queen-quote.very-long {
      font-size: 9.5px;
      line-height: 1.2;
    }

    .queen-back {
      padding: 12px;
    }

    .queen-back-name {
      margin-top: 8px;
      font-size: 11px;
    }

    .crown-icon {
      width: 68px;
      height: 58px;
    }

    .heart-icon {
      width: 48px;
      height: 48px;
    }
  }
</style>
</head>

<body>

<div id="queensViewport">
  <div id="queensBoard"></div>
</div>

<div id="dragHint">
  Drag to explore • Tap a Queen
</div>

<button id="centreButton">
  Back to Kirsty
</button>

<script>

/* =====================================================
   TOTAL NUMBER OF TILES

   Change this number whenever the total grows.

   49 currently means:
   1 central Kirsty + 48 Queens.
   ===================================================== */

const totalQueens = 49;


/* =====================================================
   ICONS
   ===================================================== */

const crownSVG = `
<svg
  class="crown-icon"
  viewBox="0 0 120 100"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <circle cx="18" cy="22" r="7"/>
  <circle cx="60" cy="10" r="7"/>
  <circle cx="102" cy="22" r="7"/>

  <path d="
    M15 32
    L36 57
    L59 22
    L83 57
    L105 32
    L96 78
    L24 78
    Z
  "/>

  <rect
    x="24"
    y="82"
    width="72"
    height="10"
    rx="3"
  />
</svg>
`;

const heartSVG = `
<svg
  class="heart-icon"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <path d="
    M50 88
    C44 80 18 61 10 46
    C0 27 11 12 28 12
    C39 12 46 19 50 27
    C54 19 61 12 72 12
    C89 12 100 27 90 46
    C82 61 56 80 50 88
    Z
  "/>
</svg>
`;


/* =====================================================
   QUEENS WITH PHOTOS

   Add a new block here ONLY when a Queen has a photo.

   The code below automatically creates enough crown-only
   cards to bring the wall up to totalQueens.
   ===================================================== */

const queens = [

  {
    id: "Q001",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738116/Q001_Kirsty_Portrait_dwgqzg.jpg",
    quote: "",
    kirsty: true
  },

  {
    id: "Q002",
    name: "Anne",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738116/Q002_Anne_nwkfry.jpg",
    quote: ""
  },

  {
    id: "Q003",
    name: "Kirstie",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738117/Q003_KirstieL_kfc4fq.jpg",
    quote: ""
  },

  {
    id: "Q004",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738118/Q004_KirstyA_ne1w9w.jpg",
    quote: "All Kirstys are ace but one Kirsty who is just a bit more wonderful than all the rest. If I can help this beautiful girl fundraise then I will do all I can."
  },

  {
    id: "Q005",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738214/Q005_Kirsty_qts7pf.jpg",
    quote: ""
  },

  {
    id: "Q006",
    name: "Hayley",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738119/Q006_Hayley_xgxap5.jpg",
    quote: ""
  },

  {
    id: "Q007",
    name: "Chris",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738120/Q007_ChrisF_hzkpsk.jpg",
    quote: ""
  },

  {
    id: "Q008",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738130/Q008_KirstyB_uvmwpz.jpg",
    quote: ""
  },

  {
    id: "Q009",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738212/Q009_KirstyE_irndpk.png",
    quote: ""
  },

  {
    id: "Q010",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738121/Q010_KirstyF_dkwd4c.png",
    quote: ""
  },

  {
    id: "Q011",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738211/Q011_KirstyO_krokbu.jpg",
    quote: ""
  },

  {
    id: "Q012",
    name: "Shazia",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738122/Q012_Shazia_kghegv.jpg",
    quote: "Proud to be supporting Kirsty, an incredible young lady raising funding for much-needed brain tumour research."
  },

  {
    id: "Q013",
    name: "Soo",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738123/Q013_SooS_l9n915.jpg",
    quote: "I’ve known a few people with brain tumours but none as young as Kirsty. When I heard her story I thought it was really time things changed."
  },

  {
    id: "Q014",
    name: "Kirsty",
    image: "https://res.cloudinary.com/dokkdedmu/image/upload/v1789738124/Q014_KirstyS_fjcxgl.jpg",
    quote: ""
  }

];


/* =====================================================
   AUTOMATIC CROWN-ONLY QUEENS

   No manual Q-number maintenance is required here.
   ===================================================== */

const usedIds = new Set(
  queens.map(queen => queen.id)
);

for (let i = 1; i <= totalQueens; i++) {

  const id =
    `Q${String(i).padStart(3, "0")}`;

  if (!usedIds.has(id)) {

    queens.push({
      id: id,
      name: "",
      image: "",
      quote: "",
      crownOnly: true
    });

  }
}


/* =====================================================
   BASIC SETUP
   ===================================================== */

const viewport =
  document.getElementById("queensViewport");

const board =
  document.getElementById("queensBoard");

const centreButton =
  document.getElementById("centreButton");

const dragHint =
  document.getElementById("dragHint");

let offsetX = 0;
let offsetY = 0;

let dragStartX = 0;
let dragStartY = 0;

let startOffsetX = 0;
let startOffsetY = 0;

let dragging = false;
let movedDuringDrag = false;

let centreCard = null;


/* =====================================================
   SHUFFLE
   ===================================================== */

function shuffle(array) {

  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }

  return copy;
}


/* =====================================================
   QUOTE SIZE
   ===================================================== */

function getQuoteClass(quote) {

  if (!quote) {
    return "queen-quote";
  }

  if (quote.length > 220) {
    return "queen-quote very-long";
  }

  if (quote.length > 150) {
    return "queen-quote long";
  }

  return "queen-quote";
}


/* =====================================================
   CREATE CARD
   ===================================================== */

function createCard(queen) {

  const card =
    document.createElement("div");

  card.className =
    "queen-card" +
    (queen.kirsty ? " kirsty" : "");

  let frontHTML = "";

  if (queen.crownOnly) {

    frontHTML = `
      <div class="queen-front crown-card">
        ${crownSVG}
      </div>
    `;

  } else {

    frontHTML = `
      <div class="queen-front photo-card">

        <div class="queen-photo">
          <img
            src="${queen.image}"
            alt="${queen.name}"
          >
        </div>

        <div class="queen-name">
          ${queen.name}
        </div>

      </div>
    `;

  }

  let backHTML = "";

  if (queen.quote) {

    const quoteClass =
      getQuoteClass(queen.quote);

    backHTML = `
      <div class="queen-back">

        <div class="${quoteClass}">
          “${queen.quote}”
        </div>

        <div class="queen-back-name">
          ${queen.name}
        </div>

      </div>
    `;

  } else {

    backHTML = `
      <div class="queen-back">
        ${heartSVG}
      </div>
    `;

  }

  card.innerHTML = `
    <div class="queen-card-inner">
      ${frontHTML}
      ${backHTML}
    </div>
  `;

  return card;
}


/* =====================================================
   BUILD WALL
   ===================================================== */

function buildWall() {

  board.innerHTML = "";

  const kirsty =
    queens.find(
      queen => queen.kirsty
    );

  const others =
    shuffle(
      queens.filter(
        queen => !queen.kirsty
      )
    );

  let columns =
    Math.ceil(
      Math.sqrt(queens.length)
    );

  if (columns % 2 === 0) {
    columns++;
  }

  let rows =
    Math.ceil(
      queens.length / columns
    );

  if (rows % 2 === 0) {
    rows++;
  }

  columns += 2;
  rows += 2;

  if (columns % 2 === 0) {
    columns++;
  }

  if (rows % 2 === 0) {
    rows++;
  }

  board.style.setProperty(
    "--columns",
    columns
  );

  const totalSlots =
    columns * rows;

  const centreRow =
    Math.floor(rows / 2);

  const centreColumn =
    Math.floor(columns / 2);

  const centreIndex =
    centreRow * columns +
    centreColumn;

  let positions = [];

  for (
    let i = 0;
    i < totalSlots;
    i++
  ) {

    if (i !== centreIndex) {
      positions.push(i);
    }

  }

  positions.sort(
    (a, b) => {

      const rowA =
        Math.floor(a / columns);

      const colA =
        a % columns;

      const rowB =
        Math.floor(b / columns);

      const colB =
        b % columns;

      const distanceA =
        Math.hypot(
          rowA - centreRow,
          colA - centreColumn
        );

      const distanceB =
        Math.hypot(
          rowB - centreRow,
          colB - centreColumn
        );

      return (
        distanceA -
        distanceB +
        (Math.random() - 0.5) * 0.5
      );

    }
  );

  const slots =
    new Array(totalSlots).fill(null);

  slots[centreIndex] =
    kirsty;

  others.forEach(
    (queen, index) => {

      slots[
        positions[index]
      ] = queen;

    }
  );

  slots.forEach(
    queen => {

      if (!queen) {

        const blank =
          document.createElement("div");

        board.appendChild(blank);

        return;

      }

      const card =
        createCard(queen);

      board.appendChild(card);

      if (queen.kirsty) {
        centreCard = card;
      }

    }
  );

  requestAnimationFrame(
    centreOnKirsty
  );

}


/* =====================================================
   BOARD POSITION
   ===================================================== */

function updateBoardPosition() {

  board.style.transform =
    `translate(${offsetX}px, ${offsetY}px)`;

}


/* =====================================================
   CENTRE ON KIRSTY
   ===================================================== */

function centreOnKirsty() {

  if (!centreCard) return;

  const viewportRect =
    viewport.getBoundingClientRect();

  board.style.transform =
    "translate(0px, 0px)";

  const cardRect =
    centreCard.getBoundingClientRect();

  offsetX =
    viewportRect.width / 2 -
    (
      cardRect.left +
      cardRect.width / 2
    );

  offsetY =
    viewportRect.height / 2 -
    (
      cardRect.top +
      cardRect.height / 2
    );

  updateBoardPosition();

}


/* =====================================================
   POINTER DOWN
   ===================================================== */

viewport.addEventListener(
  "pointerdown",
  function(event) {

    if (
      event.target.closest(
        "#centreButton"
      )
    ) {
      return;
    }

    dragging = true;
    movedDuringDrag = false;

    dragStartX =
      event.clientX;

    dragStartY =
      event.clientY;

    startOffsetX =
      offsetX;

    startOffsetY =
      offsetY;

    viewport.classList.add(
      "dragging"
    );

    viewport.setPointerCapture(
      event.pointerId
    );

  }
);


/* =====================================================
   POINTER MOVE
   ===================================================== */

viewport.addEventListener(
  "pointermove",
  function(event) {

    if (!dragging) return;

    const dx =
      event.clientX -
      dragStartX;

    const dy =
      event.clientY -
      dragStartY;

    if (
      Math.abs(dx) > 5 ||
      Math.abs(dy) > 5
    ) {

      movedDuringDrag = true;

      dragHint.classList.add(
        "hidden"
      );

    }

    offsetX =
      startOffsetX + dx;

    offsetY =
      startOffsetY + dy;

    updateBoardPosition();

  }
);


/* =====================================================
   POINTER UP
   ===================================================== */

viewport.addEventListener(
  "pointerup",
  function(event) {

    if (!dragging) return;

    const wasDragging =
      movedDuringDrag;

    dragging = false;

    viewport.classList.remove(
      "dragging"
    );

    if (!wasDragging) {

      const elementUnderPointer =
        document.elementFromPoint(
          event.clientX,
          event.clientY
        );

      const card =
        elementUnderPointer
          ? elementUnderPointer.closest(
              ".queen-card"
            )
          : null;

      if (card) {

        card.classList.toggle(
          "flipped"
        );

      }

    }

    setTimeout(
      () => {
        movedDuringDrag = false;
      },
      50
    );

  }
);


/* =====================================================
   POINTER CANCEL
   ===================================================== */

viewport.addEventListener(
  "pointercancel",
  function() {

    dragging = false;

    viewport.classList.remove(
      "dragging"
    );

  }
);


/* =====================================================
   CENTRE BUTTON
   ===================================================== */

centreButton.addEventListener(
  "pointerdown",
  function(event) {
    event.stopPropagation();
  }
);

centreButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    centreOnKirsty();

  }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  centreOnKirsty
);


/* =====================================================
   START
   ===================================================== */

buildWall();

</script>

</body>
</html>
